[Settings]
# Rose Pine GTK theme (Themix/Numix build from github.com/rose-pine/gtk, lives in ~/.themes).
# NOTE: these values are the FALLBACK. In this session gsd-xsettings is alive and
# broadcasts XSETTINGS, which take precedence - the authoritative copy of these
# values is `gsettings org.gnome.desktop.interface`, enforced by qtile/autostart_x11.sh.
# Keep both in sync.
gtk-theme-name=rose-pine-gtk
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=BreezeX-RosePine-Linux
gtk-cursor-theme-size=24
gtk-font-name=Cantarell 11
gtk-application-prefer-dark-theme=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none
