# Native Qt6 apps (copyq, polkit-kde agent, ...). Activated by QT_QPA_PLATFORMTHEME=qt5ct
# (exported in bin/starting-qtile.sh). Fusion honours a custom palette fully;
# adwaita-qt's "Adwaita-Dark" style ignores it, hence Fusion.
[Appearance]
color_scheme_path=/home/florian/.config/qt6ct/colors/rose-pine.conf
custom_palette=true
icon_theme=Papirus-Dark
standard_dialogs=default
style=Fusion

[Fonts]
fixed="JetBrains Mono Nerd Font,10,-1,5,50,0,0,0,0,0"
general="Cantarell,11,-1,5,50,0,0,0,0,0"

[Interface]
activate_item_on_single_click=1
buttonbox_layout=2
cursor_flash_time=1200
dialog_buttons_have_icons=1
double_click_interval=400
gui_effects=@Invalid()
keyboard_scheme=2
menus_have_icons=true
show_shortcuts_in_context_menus=true
stylesheets=@Invalid()
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3
