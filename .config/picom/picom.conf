# picom for the scfb (software framebuffer) X session. No GLX/DRI here, so the
# xrender backend is the only option. Kept deliberately minimal to avoid the
# missing-content artefacts that software compositing is prone to.
backend = "xrender";

# scfb has no real vsync; enabling it can stall/tear, so leave it off.
vsync = false;

# THE key setting for software (xrender/scfb) compositing: damage tracking only
# repaints "changed" regions, but on scfb that leaves large stale patches
# ("fewer but much larger artefacts"). Force a full repaint every frame -- more
# CPU, but correct.
use-damage = false;

# Keep EVERY window composited. unredir-if-possible hands fullscreen/other windows
# back to X, and on xrender-over-scfb that leaves blank/stale regions ("pieces of
# content not visible"). Disabling it fixes those artefacts.
unredir-if-possible = false;

corner-radius = 8;
shadow = false;
fading = false;
blur = false;

# Bar (qtile sets opacity=0.70) is composited by picom; these dim app windows.
opacity-rule = [
  "90:focused",
  "85:!focused"
];
